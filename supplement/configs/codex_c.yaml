run_name: codex_c
description: |
  C-layer codex sweep (gpt-5.5 via ChatGPT OAuth) — codex_omicverse +
  codex_baseline on C01-C03. 6 trajectories. Per-task wallclock budget:
  600s (enforced by runner).

  C01 prompt updated with explicit "do not use ground_truth_layer for
  hyperparameter selection" guard after a prior codex_omicverse run was
  killed for ARI-driven parameter optimization (test-set leakage).

llm:
  model: gpt-5.5
  endpoint: "(unused — codex_oauth resolves via ~/.codex/auth.json)"
  api_key_env: ""
  temperature: 0.0

agent:
  max_agent_turns: 30

scope:
  systems: [codex_omicverse, codex_baseline]
  task_ids: []
  layers: [C]
  difficulties: []
  seeds: [0]
  skip_completed: true

paths:
  trajectories_dir: trajectories
  results_dir: results
  workspace_dir: data/workspace
  logs_dir: logs
